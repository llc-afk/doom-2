<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Jogue Freedoom Phase 2 no navegador, compatível com Doom II." />
    <title>Doom II · Freedoom no navegador</title>
  </head>
  <body>
    <main class="game-root" id="game-root">
      <section class="screen" id="screen" aria-label="Jogo Doom compatível com Doom II">
        <canvas id="doom-canvas" tabindex="0" aria-label="Jogo. Use as setas para andar e virar, A e D para andar de lado, Ctrl para atirar e Espaço para usar." oncontextmenu="event.preventDefault()"></canvas>
        <div class="screen-finish" aria-hidden="true"></div>

        <section class="boot" id="boot" aria-labelledby="boot-title">
          <p class="boot-kicker">UAC MARS FACILITY · 2145</p>
          <h1 id="boot-title">DOOM<span> II</span></h1>
          <p class="boot-copy">FREEDOOM PHASE 2 · COMPATÍVEL COM DOOM II</p>
          <p class="boot-status" id="boot-status" role="status">CARREGANDO JOGO…</p>
          <button id="start-button" type="button" disabled>CARREGANDO…</button>
          <p class="boot-help">Setas: mover e virar <span>·</span> A / D: andar de lado <span>·</span> Ctrl: atirar <span>·</span> Espaço: usar <span>·</span> Shift: correr</p>
          <p class="boot-license">Conteúdo original e gratuito; não inclui os arquivos comerciais de Doom II.</p>
        </section>

        <nav class="hud hidden" id="hud" aria-label="Controles do jogo">
          <button class="hud-button touch-toggle hidden" id="touch-toggle" type="button" aria-label="Mostrar controles de toque" aria-expanded="false">⌖</button>
          <button class="hud-button" id="fullscreen-button" type="button" aria-label="Entrar em tela cheia">⛶</button>
        </nav>

        <div class="touch-pad hidden" id="touch-pad" aria-label="Controles de toque">
          <div class="touch-group movement">
            <button data-key="ArrowLeft" aria-label="Virar à esquerda">↶</button>
            <button data-key="ArrowUp" aria-label="Avançar">▲</button>
            <button data-key="ArrowRight" aria-label="Virar à direita">↷</button>
            <button data-key="ArrowDown" aria-label="Recuar">▼</button>
          </div>
          <div class="touch-group actions">
            <button data-key="KeyA" aria-label="Andar para a esquerda">◀</button>
            <button data-key="ControlLeft" aria-label="Atirar">ATIRAR</button>
            <button data-key="KeyD" aria-label="Andar para a direita">▶</button>
            <button data-key="Space" aria-label="Usar">USAR</button>
            <button data-key="ShiftLeft" aria-label="Correr">CORRER</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
